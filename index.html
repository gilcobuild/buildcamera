/* leaked-password check: only the first 5 letters of the password's fingerprint leave the phone (haveibeenpwned.com) */
const BREACHED='That password has shown up in a data breach on another website, so hackers try it first. Pick a different one.';
async function pwned(pw){try{const h=[...new Uint8Array(await crypto.subtle.digest('SHA-1',new TextEncoder().encode(pw)))].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();
  const r=await fetch('https://api.pwnedpasswords.com/range/'+h.slice(0,5),{headers:{'Add-Padding':'true'},signal:AbortSignal.timeout?AbortSignal.timeout(5000):undefined});if(!r.ok)return false;
  return (await r.text()).split('\n').some(l=>{const[x,n]=l.trim().split(':');return x===h.slice(5)&&+n>0})}catch(e){return false}}
function niceErr(e){const m=String(e&&e.message||e||'');if(m===BREACHED)return m;
  if(/Invalid login/i.test(m))return 'That email and password don\'t match. Try again or reset your password.';
  if(/not confirmed/i.test(m))return 'Confirm your email first. Open the email we sent and tap the link, then sign in.';
  if(/already registered/i.test(m))return 'That email already has an account. Sign in instead.';
  if(/Password should/i.test(m))return 'Use a password with at least 8 characters.';
  if(/fetch|network/i.test(m))return 'No connection. Check your signal and try again.';
  return m||'Something went wrong. Try again.'}

/* ---------- data (same shape the app already uses) ---------- */
const cache={},subs={};let chan=null;
const OKID=/^[A-Za-z0-9_-]{1,100}$/;
const okUrl=u=>typeof u==='string'&&(/^https:\/\//i.test(u)||/^blob:/i.test(u)||/^data:image\/(png|jpe?g|webp|gif|svg\+xml);/i.test(u)||/^\/(?![\/\\])/.test(u)||/^#/.test(u));
/* drop any nested item (pins, checklist rows…) whose id could carry code */
const deep=v=>Array.isArray(v)?v.filter(x=>!(x&&typeof x==='object'&&'id' in x&&!OKID.test(String(x.id)))).map(deep):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,deep(x)])):v;
const IDKEYS=['projectId','photoId','taskId','beforeOf','markupOf','memberId','checklistId','alertId','assetId','thumbId'];
function clean(col,id,d){if(!OKID.test(String(id)))return null;d=d&&typeof d==='object'?deep(d):{};
  for(const k of IDKEYS)if(d[k]!=null&&d[k]!==''&&!(typeof d[k]==='string'&&/^[A-Za-z0-9_\-\/.]{1,200}$/.test(d[k])))d[k]='';
  for(const k of ['lat','lng','takenAt','createdAt','radius','at'])if(d[k]!=null&&d[k]!==''){const n=Number(d[k]);d[k]=isFinite(n)?n:null}
  for(const k of ['url','thumb','avatarUrl','reviewUrl','logo'])if(d[k]!=null&&d[k]!==''&&!okUrl(d[k]))d[k]='';
  if(Array.isArray(d.tags))d.tags=d.tags.filter(t=>typeof t==='string');
  if(Array.isArray(d.projects))d.projects=d.projects.filter(x=>typeof x==='string'&&OKID.test(x));
  return d}
/* photos are private; each phone gets links that stop working after 12 hours, renewed while the app is open */
const SIGN=new Map(),SIGN_TTL=12*3600;
const mine=a=>typeof a==='string'&&TEAM&&a.startsWith(TEAM+'/');
async function signAll(m){const need=[...new Set([...m.values()].flatMap(d=>[d.assetId,d.thumbId]).filter(a=>mine(a)&&!(SIGN.get(a)?.exp>Date.now()+3600e3)))];
  for(let i=0;i<need.length;i+=100){const{data}=await sb.storage.from(BUCKET).createSignedUrls(need.slice(i,i+100),SIGN_TTL);(data||[]).forEach(r=>{if(r.signedUrl&&r.path)SIGN.set(r.path,{url:r.signedUrl,exp:Date.now()+SIGN_TTL*1000})})}
  for(const d of m.values()){if(mine(d.assetId)&&SIGN.get(d.assetId))d.url=SIGN.get(d.assetId).url;if(mine(d.thumbId)&&SIGN.get(d.thumbId))d.thumb=SIGN.get(d.thumbId).url}}
setInterval(()=>{const m=cache.photos;if(m&&m.size)signAll(m).then(()=>emit('photos')).catch(()=>{})},2*3600e3);
/* the stored record keeps the file's place, not a link */
const forDb=(col,d)=>{if(col==='photos'&&d&&mine(d.assetId)){const o={...d};delete o.url;if(mine(o.thumbId))delete o.thumb;return o}return d};
function emit(col){const m=cache[col]||new Map();const docs=[...m.entries()].map(([id,d])=>({id,exists:true,data:()=>d}));(subs[col]||[]).forEach(fn=>{try{fn({docs,size:docs.length,empty:!docs.length,docChanges:()=>[]})}catch(e){}})}
function startRealtime(){if(chan)return;chan=sb.channel('sc-'+TEAM).on('postgres_changes',{event:'*',schema:'public',table:'sc_docs',filter:'team_id=eq.'+TEAM},p=>{
  const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.col)return;if(r.team_id&&r.team_id!==TEAM)return;const m=cache[r.col]||(cache[r.col]=new Map());
  if(p.eventType==='DELETE'){m.delete(r.id);emit(r.col);return}const d=clean(r.col,r.id,r.data);if(!d)return;m.set(r.id,d);if(r.col==='photos')signAll(new Map([[r.id,d]])).catch(()=>{}).then(()=>emit(r.col));else emit(r.col)}).subscribe(st=>{if(st==='SUBSCRIBED')Object.keys(subs).forEach(load)})}
async function load(col){const out=new Map();let from=0;for(;;){const{data,error}=await sb.from('sc_docs').select('id,data').eq('team_id',TEAM).eq('col',col).range(from,from+999);if(error)throw error;data.forEach(r=>{const d=clean(col,r.id,r.data);if(d)out.set(r.id,d)});if(data.length<1000)break;from+=1000}if(col==='photos')await signAll(out).catch(()=>{});cache[col]=out;emit(col)}
const err=e=>({code:/fetch|network/i.test(String(e?.message))?'unavailable':'invalid_argument',message:String(e?.message||e)});
function docRef(col,id){id=id||crypto.randomUUID().replace(/-/g,'').slice(0,20);if(!OKID.test(String(id)))throw{code:'invalid_argument',message:'Bad record id'};return{id,path:col+'/'+id,
  async get(){const{data}=await sb.from('sc_docs').select('data').eq('team_id',TEAM).eq('col',col).eq('id',id).maybeSingle();return{id,exists:!!data,data:()=>data?.data}},
  async set(d){const m=cache[col]||(cache[col]=new Map());m.set(id,d);const{error}=await sb.from('sc_docs').upsert({team_id:TEAM,col,id,data:forDb(col,d),updated_at:new Date().toISOString()});if(error)throw err(error)},
  async update(p){const m=cache[col]||(cache[col]=new Map());let cur=m.get(id);if(!cur){const{data}=await sb.from('sc_docs').select('data').eq('team_id',TEAM).eq('col',col).eq('id',id).maybeSingle();cur=data?.data||{}}const d={...cur,...p};m.set(id,d);const{error}=await sb.from('sc_docs').upsert({team_id:TEAM,col,id,data:forDb(col,d),updated_at:new Date().toISOString()});if(error)throw err(error)},
  async delete(){cache[col]?.delete(id);const{error}=await sb.from('sc_docs').delete().eq('team_id',TEAM).eq('col',col).eq('id',id);if(error)throw err(error)},
  onSnapshot(next){const fn=s=>{const d=s.docs.find(x=>x.id===id);next({id,exists:!!d,data:()=>d?.data()})};(subs[col]=subs[col]||[]).push(fn);load(col);return()=>{subs[col]=subs[col].filter(f=>f!==fn)}}}}
const DB={doc:p=>{const[c,i]=p.split('/');return docRef(c,i)},collection:col=>({path:col,doc:id=>docRef(col,id),add:async d=>{const r=docRef(col);await r.set(d);return r},
  onSnapshot(next,onErr){(subs[col]=subs[col]||[]).push(next);startRealtime();load(col).catch(e=>onErr&&onErr(err(e)));return()=>{subs[col]=subs[col].filter(f=>f!==next)}},
  async get(){await load(col);const m=cache[col];const docs=[...m.entries()].map(([id,d])=>({id,exists:true,data:()=>d}));return{docs,size:docs.length,empty:!docs.length}}})};

/* ---------- photos and files ---------- */
const EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic','video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm','audio/mp4':'m4a','audio/x-m4a':'m4a','audio/mpeg':'mp3','audio/webm':'webm','audio/wav':'wav','application/pdf':'pdf'};
const ASSETS={async upload(blob){const type=(blob.type||'application/octet-stream').split(';')[0];const d=new Date();const path=`${TEAM}/${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}/${crypto.randomUUID()}.${EXT[type]||'bin'}`;
    const{error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:type,cacheControl:'31536000',upsert:false});if(error)throw{code:/size|large/i.test(error.message)?'too_large':'upstream_error',message:error.message};
    const{data,error:e2}=await sb.storage.from(BUCKET).createSignedUrl(path,SIGN_TTL);if(e2)throw{code:'upstream_error',message:e2.message};SIGN.set(path,{url:data.signedUrl,exp:Date.now()+SIGN_TTL*1000});return{id:path,url:data.signedUrl,sizeBytes:blob.size,contentType:type}},
  async list(){throw{code:'capability_disabled',message:'n/a'}},
  async delete(id){const{error}=await sb.storage.from(BUCKET).remove([id]);return{deleted:!error}}};

/* ---------- downloads: share sheet on phones, normal download elsewhere ---------- */
const DLS={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data]);const file=new File([blob],filename,{type:blob.type||'application/octet-stream'});
  if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return{status:'saved'}}catch(e){if(e&&e.name==='AbortError')throw{code:'declined',message:'Cancelled'}}}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return{status:'saved'}}};

/* ---------- photo processing ---------- */
async function readExif(file){
  try{
    if(!/jpe?g/i.test(file.type)&&!/\.jpe?g$/i.test(file.name||''))return null;
    const v=new DataView(await file.slice(0,262144).arrayBuffer());
    if(v.getUint16(0)!==0xFFD8)return null; let o=2;
    while(o<v.byteLength-10){const m=v.getUint16(o);if((m&0xFF00)!==0xFF00)return null;const len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return parseTiff(v,o+10);o+=2+len}
  }catch(e){}return null;
}
function parseTiff(v,t){
  try{
    const le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);
    const ifd=p=>{const n=u16(p),e={};for(let i=0;i<n;i++){const q=p+2+i*12;e[u16(q)]={count:u32(q+4),off:q+8}}return e};
    const rat=p=>u32(p)/(u32(p+4)||1), out={}, e0=ifd(t+u32(t+4));
    if(e0[0x8825]){const g=ifd(t+u32(e0[0x8825].off));const ch=en=>en?String.fromCharCode(v.getUint8(en.off)):'';
      const tri=en=>{if(!en)return null;const p=t+u32(en.off);return rat(p)+rat(p+8)/60+rat(p+16)/3600};
      const la=tri(g[2]),ln=tri(g[4]);if(la!=null&&ln!=null&&(la||ln)){out.lat=ch(g[1])==='S'?-la:la;out.lng=ch(g[3])==='W'?-ln:ln}}
    if(e0[0x8769]){const ex=ifd(t+u32(e0[0x8769].off)),d=ex[0x9003];if(d&&d.count>=19){const p=t+u32(d.off);let s='';for(let i=0;i<19;i++)s+=String.fromCharCode(v.getUint8(p+i));
      const m=s.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);if(m)out.taken=new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime()}}
    return out;
  }catch(e){return null}
}

async function makeCode(seed){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let b;
  try{b=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(seed+Math.random())))]}catch(e){b=[...Array(8)].map(()=>Math.floor(Math.random()*256))}
  let c='';for(let i=0;i<8;i++)c+=A[b[i]%32];return 'PC-'+c.slice(0,4)+'-'+c.slice(4);
}

async function storeStatus(){const el=$('#st-store');if(!el||!window.BC||!BC.storage)return;try{const r=await BC.storage();if(!r)return;const lim=r.limitGb*1e9,pc=Math.min(100,Math.round(r.used/lim*100)),left=Math.max(0,Math.round((lim-r.used)/3.5e6));

async function makeThumb(src){try{const w0=src.width||src.naturalWidth,h0=src.height||src.naturalHeight,sc=Math.min(1,640/Math.max(w0,h0));const c=document.createElement('canvas');c.width=Math.round(w0*sc);c.height=Math.round(h0*sc);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.8))}catch(e){return null}}

const gmSearch=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a||'');
function knownAddresses(){
  const m=new Map();
  S.projects.forEach(p=>{if(p.address){const k=p.address.trim().toLowerCase();if(!m.has(k))m.set(k,{address:p.address.trim(),lat:p.lat,lng:p.lng,from:p.name,customer:p.customer})}});
  return [...m.values()];
}
function parseGps(t){
  t=String(t||'').trim(); if(!t)return null; let m,la,ln;
  if((m=t.match(/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/))||(m=t.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/))||(m=t.match(/[?&](?:q|ll|query|center|destination|sll)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i))){la=+m[1];ln=+m[2]}
  else if((m=t.match(/(-?\d{1,2}\.\d{3,})\s*°?\s*([NS])?\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})\s*°?\s*([EW])?/i))){la=+m[1];ln=+m[3];if(m[2]&&/s/i.test(m[2]))la=-Math.abs(la);if(m[4]&&/w/i.test(m[4]))ln=-Math.abs(ln)}
  else if((m=t.match(/(\d{1,2})°\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([NS])[\s,]+(\d{1,3})°\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([EW])/i))){la=+m[1]+m[2]/60+m[3]/3600;ln=+m[5]+m[6]/60+m[7]/3600;if(/s/i.test(m[4]))la=-la;if(/w/i.test(m[8]))ln=-ln}
  else return null;
  if(!(Math.abs(la)<=90&&Math.abs(ln)<=180)||(la===0&&ln===0))return null;
  return {lat:+la.toFixed(6),lng:+ln.toFixed(6)};
}
function addrFromLink(t){const m=String(t).match(/\/maps\/place\/([^/@?]+)/);if(!m)return '';try{return decodeURIComponent(m[1].replace(/\+/g,' ')).trim()}catch(e){return ''}}
function gpsMsg(pre,txt,cls){const el=$('#'+pre+'-gpsmsg');if(el){el.textContent=txt;el.className='mono '+(cls||'')}}
function showSuggest(pre){
  const inp=$('#'+pre+'-address'),box=$('#'+pre+'-acl');if(!inp||!box)return;
  const q=inp.value.trim().toLowerCase(); const words=q.split(/\s+/).filter(Boolean);
  const kn=q.length<2?[]:knownAddresses().filter(a=>a.address.toLowerCase()!==q&&words.every(w=>(a.address+' '+(a.from||'')).toLowerCase().includes(w))).slice(0,3);
  const tt=(AC[pre]||[]).filter(a=>!kn.some(k=>k.address.toLowerCase()===a.address.toLowerCase())&&a.address.toLowerCase()!==q);
  const list=[...kn,...tt].slice(0,7);
  if(!list.length){box.hidden=true;box.innerHTML='';inp.setAttribute('aria-expanded','false');return}
  box.innerHTML=list.map((a,i)=>`<button type="button" role="option" data-a="acPick" data-pre="${pre}" data-i="${i}"><b>${esc(a.address)}</b><span>${a.src==='tt'?(a.kind==='Street'?'Street only · set exact spot after':'Address search · fills GPS'):'Used on '+esc(a.from)+(a.lat!=null?' · GPS on file':'')}</span></button>`).join('');
  box._list=list; box.hidden=false;if(tt.length)box.insertAdjacentHTML('beforeend','<span class="note" style="display:block;padding:6px 12px;font-size:11px">Address results by TomTom</span>'); inp.setAttribute('aria-expanded','true');
}

/* daily log */
function dayData(p,date){
  const ps=allPhotos().filter(x=>x.projectId===p.id&&dayKey(x.takenAt)===date);
  const done=S.tasks.filter(t=>t.projectId===p.id&&t.done&&t.doneAt&&dayKey(t.doneAt)===date);
  const tm=S.time.filter(t=>t.projectId===p.id&&dayKey(t.in)===date);
  const crews={};tm.forEach(t=>{const h=((t.out||Date.now())-t.in)/36e5;const k=t.who||'Crew';crews[k]=(crews[k]||0)+h});
  const cks=[];S.checklists.filter(c=>c.projectId===p.id).forEach(c=>c.items.forEach(i=>{if(i.done&&i.doneAt&&dayKey(i.doneAt)===date)cks.push(c.title+': '+i.t)}));
  return {ps,done,crews,cks,zones:[...new Set(ps.map(x=>x.zone).filter(Boolean))],trades:[...new Set(ps.map(x=>x.trade).filter(Boolean))]};

/* geometry and job matching */
function toM(lat,lng,lat0,lng0){return [(lng-lng0)*Math.cos(lat0*Math.PI/180)*111320,(lat-lat0)*110540]}
function fromM(x,y,lat0,lng0){return [lat0+y/110540,lng0+x/(Math.cos(lat0*Math.PI/180)*111320)]}
function inPoly(lat,lng,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1];if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))ins=!ins}return ins}
function matchProject(la,ln){
  const act=S.projects.filter(p=>p.status!=='Done');
  const inside=act.find(p=>p.boundary&&p.boundary.length>=3&&inPoly(la,ln,p.boundary));if(inside)return inside;
  let best=null;act.forEach(p=>{if(p.lat==null||(p.boundary&&p.boundary.length>=3))return;const d=km(la,ln,p.lat,p.lng)*1000;if(d<=(p.radius||1200)&&(!best||d<best.d))best={p,d}});return best&&best.p;
}

function quality(src,W,H){try{const s=256/Math.max(W,H),w=Math.max(8,Math.round(W*s)),h=Math.max(8,Math.round(H*s));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(src,0,0,w,h);const d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);let sum=0;for(let i=0;i<w*h;i++){g[i]=.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2];sum+=g[i]}const mean=sum/(w*h);let lv=0,lm=0,n=0;for(let y=1;y<h-1;y++)for(let q=1;q<w-1;q++){const i=y*w+q,l=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w];lm+=l;lv+=l*l;n++}lm/=n;const v=lv/n-lm*lm;return {blurry:v<55,dark:mean<45}}catch(e){return null}}

function biasPos(pre){const la=$('#'+pre+'-lat')?.value,ln=$('#'+pre+'-lng')?.value;if(la&&ln)return [+la,+ln];const g=S.projects.filter(p=>p.lat!=null);if(g.length)return [g.reduce((a,p)=>a+p.lat,0)/g.length,g.reduce((a,p)=>a+p.lng,0)/g.length];return null}

function parseRows(t){const d=t.includes('\t')?'\t':',';const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===d){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}if(cur||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(c=>String(c).trim()))}

function weekData(p,from,to){
  const inR=ts=>ts&&dayKey(ts)>=from&&dayKey(ts)<=to;
  const ps=allPhotos().filter(x=>x.projectId===p.id&&inR(x.takenAt)&&x.kind==='photo');
  const done=S.tasks.filter(t=>t.projectId===p.id&&t.done&&inR(t.doneAt));
  const open=S.tasks.filter(t=>t.projectId===p.id&&!t.done);
  const cks=[];S.checklists.filter(c=>c.projectId===p.id).forEach(c=>c.items.forEach(i=>{if(i.done&&inR(i.doneAt))cks.push(c.title+': '+i.t)}));
  const hrs=S.time.filter(t=>t.projectId===p.id&&inR(t.in)).reduce((a,t)=>a+((t.out||Date.now())-t.in)/36e5,0);
  return {ps,done,open,cks,hrs,zones:[...new Set(ps.map(x=>x.zone).filter(Boolean))],trades:[...new Set(ps.map(x=>x.trade).filter(Boolean))]};

async function zipAll(p){

async function sxShare(){

    if(navigator.canShare({files})){try{await navigator.clipboard.writeText(msg)}catch(e){}await navigator.share({files,text:msg});toast(files.length>1?files.length+' photos sent as one group':'Sent to the share sheet');return}}}catch(e){if(e&&e.name==='AbortError')return}

}

async function handleFiles(files,kind){
  if(!files.length)return;
  if(kind==='logo'){const f=files[0];if(!AS){toast('Uploads aren\'t available here.');return}toast('Uploading logo…');try{const up=await AS.upload(f);await put('settings',{...SET(),id:'company',logoUrl:up.url,logoAsset:up.id});LOGO.url=null;toast('Logo saved. New photos and PDFs will use it.')}catch(e){toast('Couldn\'t upload the logo. Try a PNG or JPG under 5 MB.')}return}
  if(kind==='avatar'){try{toast('Saving your photo…');const blob=await avCrop(files[0]);let url;if(AS){const up=await AS.upload(blob);url=up.url}else url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
    const cur=S.settings.find(x=>x.id==='avatars')||{id:'avatars',map:{}};const map={...(cur.map||{})};if(ME.id)map['id:'+ME.id]=url;map['n:'+ME.name]=url;await put('settings',{id:'avatars',map});toast('Your photo is set. It shows on the photos you take.')}catch(e){toast('Couldn\'t use that photo. Try another one.')}return}
  if(kind==='csv'){const t=await files[0].text();M={kind:'import',text:t,rows:mapRows(parseRows(t))};renderModal();return}
  if(kind==='audio'&&M&&M.voiceFor){const pid=M.voiceFor;const f=files[0];toast('Uploading voice note…');
    try{if(!AS)throw 0;const up=await AS.upload(f);upd('photos',pid,{voiceUrl:up.url,voiceAsset:up.id});renderModal();toast('Voice note added')}catch(e){toast('Couldn\'t upload the voice note. Try again with signal.')}return}
  const ctx={...(M&&M.ctx||{tags:[],zone:'',trade:'',note:''}),projectId:M&&M.pid||V.lastProject,lockProject:!!(M&&M.lockProject),beforeOf:M&&M.beforeOf,kind:kind==='doc'?'doc':undefined,fromCamera:kind==='photo'};
  if(!ctx.projectId&&!S.projects.length){toast('Add a Project first.');return}
  if(ctx.projectId&&kind!=='doc')setLastZT(ctx.projectId,ctx.zone,ctx.trade,(ctx.tags||[])[0]);
  const cb=afterShot; afterShot=null;
  const keepOpen=M&&M.kind==='capture'&&!M.single&&!M.hidden;
  if(keepOpen){const cm=M;ctx.onAdd=id=>{cm.shot=[id,...(cm.shot||[])];if(M===cm)capStrip()}}
  if(!keepOpen)closeModal();
  toast(files.length>1?`Stamping ${files.length} photos…`:'Stamping photo…');
  let last=null; for(const f of files){try{last=await processFile(f,ctx)}catch(e){toast('Couldn\'t read that file. Try another photo.')}}
  if(last&&cb)cb(last);
  if(last&&!cb&&ctx.beforeOf)toast('After photo paired. Open either one to compare.',3200);
  else if(last&&!cb)toast(files.length>1?files.length+' saved':'Saved with stamp and proof code');
  if(keepOpen&&M&&M.kind==='capture'){M.ctx.note='';const n=$('#cap-note');if(n)n.value='';M.count=(M.count||0)+files.length;const c=$('#cap-count');if(c){c.hidden=false;c.className='callout info';c.innerHTML=`<b>${M.count} saved</b> this round. Keep going, or close when you're done. You can delete any photo later.`}const b=$('#cap-shoot');if(b)b.innerHTML=I('camera')+' Take Next Photo'}
}

async function deleteJob(p,mode,to){
  const ph=allPhotos().filter(x=>x.projectId===p.id),ids=new Set(ph.map(x=>x.id));let n=0;const tick=()=>{const m=$('#busymsg');if(m)m.textContent=(++n)+' done'};
  for(const x of ph){if(x.pending){delete PEND[x.id];await qDrop(x.id);continue}
    if(mode==='move'&&to){await upd('photos',x.id,{projectId:to});tick();continue}
    await del('photos',x.id);if(AS&&x.assetId&&!allPhotos().some(y=>y.assetId===x.assetId&&!ids.has(y.id)))delAsset(x);if(AS&&x.voiceAsset)AS.delete(x.voiceAsset).catch(()=>{});tick()}
  for(const c of S.comments.filter(c=>(c.projectId===p.id&&!c.photoId)||(mode!=='move'&&ids.has(c.photoId))))await del('comments',c.id);
  if(mode==='move'&&to)for(const c of S.comments.filter(c=>ids.has(c.photoId)))await upd('comments',c.id,{projectId:to});
  for(const t of S.tasks.filter(t=>t.projectId===p.id))await del('tasks',t.id);
  for(const c of S.checklists.filter(c=>c.projectId===p.id))await del('checklists',c.id);
  for(const l of S.logs.filter(l=>l.projectId===p.id))await del('logs',l.id);
  for(const t of S.time.filter(t=>t.projectId===p.id))await del('time',t.id);
  for(const a of S.alerts.filter(a=>a.projectId===p.id))await del('alerts',a.id);
  for(const m of S.members.filter(m=>(m.projects||[]).includes(p.id)))await upd('members',m.id,{projects:m.projects.filter(x=>x!==p.id)});
  if(window.BC&&BC.revokeJobShares)try{await BC.revokeJobShares(p.id)}catch(e){}
  await del('projects',p.id);
}

  return `<button class="btn sm bkm" data-a="tab" data-t="more">${I('back')} Menu</button><div class="row" style="margin-top:6px"><h1 style="flex:1">Activity</h1><div class="seg sm" role="group" aria-label="Week"><button data-a="dashWk" data-w="1" aria-pressed="${wk===1}">Last Week</button><button data-a="dashWk" data-w="0" aria-pressed="${wk===0}">This Week</button></div></div><p class="sub">${range}</p>
  <div class="kpis"><div class="kpi"><b>${ps.length}</b><span>Photos taken</span></div><div class="kpi"><b>${new Set(ps.map(x=>x.projectId)).size}</b><span>Jobs with photos</span></div><div class="kpi"><b>${punch.length}</b><span>Open punch items (all jobs)</span></div><div class="kpi"><b>${Object.keys(who).length}</b><span>People posting</span></div></div>
  <div class="hcard"><h2 class="hsec"><span>Photos per day</span></h2><div class="bars" role="img" aria-label="Photos per day: ${days.map(d=>d.lab+' '+d.n).join(', ')}">${days.map(d=>`<div class="bar" title="${d.lab} ${d.k}: ${d.n} photo${d.n===1?'':'s'}"><i style="height:${(d.n/mx*100).toFixed(1)}%"></i>${d.n?`<span class="v" style="bottom:calc(${(d.n/mx*100).toFixed(1)}% + 4px)">${d.n}</span>`:''}</div>`).join('')}</div><div class="barx">${days.map(d=>`<span>${d.lab}</span>`).join('')}</div></div>
  <div class="dgrid" style="margin-top:14px"><div class="hcard"><h2 class="hsec"><span>By job</span></h2>${jr.length?`<table class="dtab"><thead><tr><th>Job</th><th class="n">Photos</th><th class="n">Open punch</th></tr></thead><tbody>${jr.map(r=>`<tr><td><button class="linkb" style="font-size:14px;text-align:left" data-a="openProject" data-id="${r.p.id}">${esc(r.p.name)}</button></td><td class="n">${r.n}</td><td class="n">${r.o}</td></tr>`).join('')}</tbody></table>`:'<p class="note">No photos or punch items this week.</p>'}</div>
  <div class="stack" style="gap:14px"><div class="hcard"><h2 class="hsec"><span>Who's posting</span></h2>${Object.keys(who).length?`<table class="dtab"><tbody>${Object.entries(who).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td><span class="row" style="gap:8px">${avHtml(k,'av')}${esc(k)}</span></td><td class="n">${n}</td></tr>`).join('')}</tbody></table>`:'<p class="note">Nobody has posted this week.</p>'}</div>
  <div class="hcard"><h2 class="hsec"><span>Open punch by trade</span></h2>${Object.keys(byTrade).length?`<table class="dtab"><tbody>${Object.entries(byTrade).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td>${esc(k)}</td><td class="n">${n}</td></tr>`).join('')}</tbody></table>`:'<p class="note">No open punch items.</p>'}</div></div></div>`}
function setPhotoTags(p,tags){const q=['#modal .pvside','#modal .sb'],ys=q.map(x=>document.querySelector(x)?.scrollTop||0);
  upd('photos',p.id,{tags,portfolio:tags.includes('Portfolio')});if(M&&M.kind==='photo'&&M.id===p.id){renderModal();q.forEach((x,i)=>{const e=document.querySelector(x);if(e)e.scrollTop=ys[i]})}}
function tagRowsHtml(){return tagList().map((t,i,a)=>`<div class="ck" style="align-items:center;gap:6px"><input type="text" id="tg-${i}" value="${esc(t)}" data-ch="tagRen" data-i="${i}" ${t==='Portfolio'?'disabled title="Portfolio is built in"':''} autocapitalize="words" aria-label="Tag name" style="flex:1;min-width:0"><button class="ib" data-a="tagMove" data-i="${i}" data-d="-1" ${i?'':'disabled'} aria-label="Move ${esc(t)} up">${I('back','up')}</button><button class="ib" data-a="tagMove" data-i="${i}" data-d="1" ${i<a.length-1?'':'disabled'} aria-label="Move ${esc(t)} down">${I('back','down')}</button>${t==='Portfolio'?'<span class="ib" aria-hidden="true"></span>':`<button class="ib" data-a="tagDel" data-i="${i}" aria-label="Remove ${esc(t)}">${I('trash')}</button>`}</div>`).join('')}
function saveTags(list){const l=[...new Set(list.map(t=>String(t).trim()).filter(Boolean))];if(!l.includes('Portfolio'))l.push('Portfolio');return put('settings',{id:'tags',list:l})}
async function avCrop(file){const url=URL.createObjectURL(file);try{const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),m=Math.min(img.naturalWidth,img.naturalHeight);
  x.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,256,256);return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}finally{URL.revokeObjectURL(url)}}
async function usage(){if(!AS)return;try{const r=await AS.list();const el=$('#usage');if(el)el.textContent=`Storage: ${r.usage.files} files, ${(r.usage.bytes/1048576).toFixed(1)} MB of ${(r.usage.maxBytes/1048576/1024).toFixed(1)} GB`}catch(e){}}

/* ---------- start ---------- */
try{matchMedia('(min-width:1000px)').addEventListener('change',()=>{render();if(M&&M.kind!=='cam')renderModal()})}catch(e){}
render();
(async()=>{
  const use=n=>window.claude?.use?.(n).catch(()=>null)||Promise.resolve(null);
  const [db,as,us,sm,dl,mc]=await Promise.all([use('db'),use('assets'),use('user'),use('sample'),use('downloads'),use('mcp')]);
  DB=db;AS=as;USER=us;SAMPLE=sm;DL=dl;MCP=mc;READY=true;
  if(USER){try{const me=await USER.me();ME={id:me.id,name:me.name||'Me'}}catch(e){}}
  if(!DB){loadLocal()}else{
    COLS.forEach(c=>DB.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({...d.data(),id:d.id}));scheduleRender()},()=>{}));
  }
  qLoad(); render();
  setTimeout(()=>{if(!onbSeen()&&!M)openModal({kind:'onboard',step:0})},600);
})();
</script>
