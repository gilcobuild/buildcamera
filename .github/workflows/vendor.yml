name: Vendor libraries
on:
  push:
    branches: [vendor]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[vendored]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir -p tmp pdfjs && cd tmp
          npm pack pdfjs-dist@3.11.174 >/dev/null && tar xzf pdfjs-dist-3.11.174.tgz
          cp package/legacy/build/pdf.min.js package/legacy/build/pdf.worker.min.js ../pdfjs/
          rm -rf package && npm pack pdf-lib@1.17.1 >/dev/null && tar xzf pdf-lib-1.17.1.tgz && mkdir -p ../pdflib && cp package/dist/pdf-lib.min.js ../pdflib/
          rm -rf package && npm pack qrcode-generator@1.4.4 >/dev/null && tar xzf qrcode-generator-1.4.4.tgz && mkdir -p ../qr && cp package/qrcode.js ../qr/qrcode.js && cp package/LICENSE ../qr/LICENSE 2>/dev/null || true
          rm -rf package && npm pack jspdf@2.5.1 >/dev/null && tar xzf jspdf-2.5.1.tgz && mkdir -p ../jspdf && cp package/dist/jspdf.umd.min.js ../jspdf/
          cd .. && rm -rf tmp && sha256sum pdfjs/* > pdfjs/SHA256SUMS && sha256sum pdflib/* > pdflib/SHA256SUMS && sha256sum qr/qrcode.js > qr/SHA256SUMS && sha256sum jspdf/jspdf.umd.min.js > jspdf/SHA256SUMS && ls -la pdfjs pdflib qr
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add pdfjs pdflib qr jspdf && git commit -m "pdf.js 3.11.174 + pdf-lib 1.17.1 + qrcode-generator 1.4.4 + jspdf 2.5.1 [vendored]" && git push
