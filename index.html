<script>
/* Build Camera: runs the app on its own domain with Supabase for logins, data and photos */
(function(){
const SB_URL='https://zrdgebzujpsatzxcvryi.supabase.co', SB_KEY='sb_publishable_VZXm4AVVTzMUzg_HFs_xug_F4ixJM5R', BUCKET='sitecam';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let TEAM=null,TEAMNAME='',ROLE='',USR=null,MYNAME='';
let ready,readyP=new Promise(r=>ready=r);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---------- sign-in screen ---------- */
const css=`#bcgate{position:fixed;inset:0;z-index:100;background:var(--bg,#eef0ed);color:var(--ink,#1b2024);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 28px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(20px,env(safe-area-inset-left,0px));font-family:var(--f-body,system-ui,sans-serif)}
#bcgate .bx{max-width:420px;margin:0 auto;display:grid;gap:14px}
#bcgate .fm{display:grid;gap:12px;margin:0}
#bcgate .lg{display:flex;align-items:center;gap:12px;margin-bottom:6px}
#bcgate .lg i{width:52px;height:52px;border-radius:14px;background:#1b2024;display:grid;place-items:center}
#bcgate .lg i b{width:30px;height:30px;border-radius:50%;background:#f2b705;display:block;box-shadow:inset 0 0 0 7px #f2b705,inset 0 0 0 10px #1b2024}
#bcgate h1{font-family:var(--f-display,Arial Narrow,sans-serif);font-size:32px;margin:0;line-height:1}
#bcgate h1 small{display:block;font-family:var(--f-mono,monospace);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted,#59626a);margin-top:4px}
#bcgate h2{font-size:20px;margin:6px 0 0}
#bcgate label{display:grid;gap:5px;font-size:12px;font-family:var(--f-mono,monospace);letter-spacing:.05em;text-transform:uppercase;color:var(--muted,#59626a)}
#bcgate input{font:16px var(--f-body,system-ui);text-transform:none;letter-spacing:0;color:var(--ink,#1b2024);background:var(--panel,#fff);border:1px solid var(--line,#d7dbd5);border-radius:10px;padding:12px;min-height:48px;width:100%}
#bcgate button{font:600 16px var(--f-body,system-ui);border-radius:10px;min-height:50px;border:1px solid var(--line,#d7dbd5);background:var(--panel,#fff);color:var(--ink,#1b2024);cursor:pointer}
#bcgate button.pri{background:#f2b705;border-color:#f2b705;color:#1b2024}
#bcgate .lnk{background:none;border:0;min-height:40px;color:var(--accent,#1d5c8f);font-weight:600}
#bcgate .msg{font-size:14px;border-radius:10px;padding:10px 12px;background:var(--accent-soft,#e1ebf4)}
#bcgate .msg.bad{background:var(--bad-soft,#f9e3e1);color:var(--bad,#b3261e)}
#bcgate .note{font-size:13px;color:var(--muted,#59626a)}`;
function gate(html){let g=document.getElementById('bcgate');if(!g){const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);g=document.createElement('div');g.id='bcgate';g.setAttribute('role','dialog');g.setAttribute('aria-label','Sign in to Build Camera');document.body.appendChild(g)}
  g.innerHTML=`<div class="bx"><div class="lg"><i aria-hidden="true"><b></b></i><h1>Build Camera<small>Jobsite photos</small></h1></div>${html}</div>`;g.hidden=false;return g}
function closeGate(){const g=document.getElementById('bcgate');if(g)g.remove()}
function say(t,bad){const m=document.getElementById('bcmsg');if(m){m.textContent=t;m.className='msg'+(bad?' bad':'');m.hidden=!t}}
function busy(b,on,txt){if(!b)return;b.disabled=on;if(txt)b.textContent=txt}

function showSignIn(mode){
  mode=mode||'in';
  const g=gate(`<h2>${mode==='up'?'Create Your Account':mode==='reset'?'Reset Password':'Sign In'}</h2>
  <p id="bcmsg" class="msg" hidden></p>
  <form id="bcf" class="fm">
   ${mode==='up'?'<label>Your Name<input id="bc-name" autocomplete="name" autocapitalize="words" required></label>':''}
   <label>Email<input id="bc-email" type="email" autocomplete="email" inputmode="email" required value="${esc(lsGet('bc-email')||'')}"></label>
   ${mode!=='reset'?`<label>Password<input id="bc-pw" type="password" autocomplete="${mode==='up'?'new-password':'current-password'}" minlength="8" required></label>`:''}
   <button class="pri" type="submit" id="bcgo">${mode==='up'?'Create Account':mode==='reset'?'Email Me a Reset Link':'Sign In'}</button>
  </form>
  ${mode==='in'?'<button class="lnk" data-m="up">New here? Create an account</button><button class="lnk" data-m="reset">Forgot password?</button>':'<button class="lnk" data-m="in">Back to sign in</button>'}`);
  g.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>showSignIn(b.dataset.m));
  g.querySelector('#bcf').onsubmit=async e=>{e.preventDefault();const em=g.querySelector('#bc-email').value.trim(),pw=g.querySelector('#bc-pw')?.value,b=g.querySelector('#bcgo');lsSet('bc-email',em);say('');
    try{
      if(mode==='reset'){busy(b,true,'Sending…');const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(error)throw error;say('Check your email for the reset link.');busy(b,false,'Email Me a Reset Link');return}
      if(mode==='up'){busy(b,true,'Creating…');const nm=g.querySelector('#bc-name').value.trim();lsSet('bc-name',nm);const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{name:nm},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
        if(!data.session){say('Almost done. Open the email we just sent and tap the link to confirm, then sign in here.');busy(b,false,'Create Account');return}}
      else{busy(b,true,'Signing in…');const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error}
      await afterAuth();
    }catch(err){busy(b,false,mode==='up'?'Create Account':mode==='reset'?'Email Me a Reset Link':'Sign In');say(niceErr(err),true)}};
}
function niceErr(e){const m=String(e&&e.message||e||'');
  if(/Invalid login/i.test(m))return 'That email and password don\'t match. Try again or reset your password.';
  if(/not confirmed/i.test(m))return 'Confirm your email first. Open the email we sent and tap the link, then sign in.';
  if(/already registered/i.test(m))return 'That email already has an account. Sign in instead.';
  if(/Password should/i.test(m))return 'Use a password with at least 8 characters.';
  if(/fetch|network/i.test(m))return 'No connection. Check your signal and try again.';
  return m||'Something went wrong. Try again.'}

function showTeamSetup(){
  const g=gate(`<h2>Set Up Your Company</h2><p class="note">Signed in as ${esc(USR.email)}.</p><p id="bcmsg" class="msg" hidden></p>
   <form id="bct" class="fm"><label>Company Name<input id="bc-co" autocapitalize="words" value="Gilco Construction" required></label><button class="pri" type="submit">Create Company</button></form>
   <p class="note" style="text-align:center;margin:4px 0">or, if your boss sent you a code</p>
   <form id="bcj" class="fm"><label>Invite Code<input id="bc-code" autocapitalize="characters" autocomplete="off" placeholder="ABC123" required></label><button type="submit">Join a Company</button></form>
   <button class="lnk" id="bcout">Sign out</button>`);
  const nm=USR.user_metadata?.name||lsGet('bc-name')||'';
  g.querySelector('#bct').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');busy(b,true,'Creating…');const{data,error}=await sb.rpc('sc_create_team',{team_name:g.querySelector('#bc-co').value,my_name:nm});if(error){busy(b,false,'Create Company');say(niceErr(error),true);return}lsSet('bc-team',data);await afterAuth()};
  g.querySelector('#bcj').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');busy(b,true,'Joining…');const{data,error}=await sb.rpc('sc_join',{invite_code:g.querySelector('#bc-code').value,my_name:nm});if(error){busy(b,false,'Join a Company');say(niceErr(error),true);return}lsSet('bc-team',data);await afterAuth()};
  g.querySelector('#bcout').onclick=()=>BC.signOut();
}

async function afterAuth(){
  const{data:{user}}=await sb.auth.getUser();if(!user){showSignIn();return}
  USR=user;MYNAME=user.user_metadata?.name||lsGet('bc-name')||user.email.split('@')[0];
  const{data:ms,error}=await sb.from('sc_members').select('team_id,role,name,sc_teams(name)').eq('user_id',user.id);
  if(error){gate(`<p class="msg bad">Couldn't load your company. Check your signal, then <button class="lnk" onclick="location.reload()">try again</button>.</p>`);return}
  if(!ms||!ms.length){showTeamSetup();return}
  const pick=ms.find(m=>m.team_id===lsGet('bc-team'))||ms[0];
  TEAM=pick.team_id;ROLE=pick.role;TEAMNAME=pick.sc_teams?.name||'';if(pick.name)MYNAME=pick.name;lsSet('bc-team',TEAM);
  closeGate();ready();
}

/* ---------- data (same shape the app already uses) ---------- */
const cache={},subs={};let chan=null;
function emit(col){const m=cache[col]||new Map();const docs=[...m.entries()].map(([id,d])=>({id,exists:true,data:()=>d}));(subs[col]||[]).forEach(fn=>{try{fn({docs,size:docs.length,empty:!docs.length,docChanges:()=>[]})}catch(e){}})}
function startRealtime(){if(chan)return;chan=sb.channel('sc-'+TEAM).on('postgres_changes',{event:'*',schema:'public',table:'sc_docs',filter:'team_id=eq.'+TEAM},p=>{
  const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.col)return;if(r.team_id&&r.team_id!==TEAM)return;const m=cache[r.col]||(cache[r.col]=new Map());
  if(p.eventType==='DELETE')m.delete(r.id);else m.set(r.id,r.data||{});emit(r.col)}).subscribe(st=>{if(st==='SUBSCRIBED')Object.keys(subs).forEach(load)})}
async function load(col){const out=new Map();let from=0;for(;;){const{data,error}=await sb.from('sc_docs').select('id,data').eq('team_id',TEAM).eq('col',col).range(from,from+999);if(error)throw error;data.forEach(r=>out.set(r.id,r.data));if(data.length<1000)break;from+=1000}cache[col]=out;emit(col)}
const err=e=>({code:/fetch|network/i.test(String(e?.message))?'unavailable':'invalid_argument',message:String(e?.message||e)});
function docRef(col,id){id=id||crypto.randomUUID().replace(/-/g,'').slice(0,20);return{id,path:col+'/'+id,
  async get(){const{data}=await sb.from('sc_docs').select('data').eq('team_id',TEAM).eq('col',col).eq('id',id).maybeSingle();return{id,exists:!!data,data:()=>data?.data}},
  async set(d){const m=cache[col]||(cache[col]=new Map());m.set(id,d);const{error}=await sb.from('sc_docs').upsert({team_id:TEAM,col,id,data:d,updated_at:new Date().toISOString()});if(error)throw err(error)},
  async update(p){const m=cache[col]||(cache[col]=new Map());let cur=m.get(id);if(!cur){const{data}=await sb.from('sc_docs').select('data').eq('team_id',TEAM).eq('col',col).eq('id',id).maybeSingle();cur=data?.data||{}}const d={...cur,...p};m.set(id,d);const{error}=await sb.from('sc_docs').upsert({team_id:TEAM,col,id,data:d,updated_at:new Date().toISOString()});if(error)throw err(error)},
  async delete(){cache[col]?.delete(id);const{error}=await sb.from('sc_docs').delete().eq('team_id',TEAM).eq('col',col).eq('id',id);if(error)throw err(error)},
  onSnapshot(next){const fn=s=>{const d=s.docs.find(x=>x.id===id);next({id,exists:!!d,data:()=>d?.data()})};(subs[col]=subs[col]||[]).push(fn);load(col);return()=>{subs[col]=subs[col].filter(f=>f!==fn)}}}}
const DB={doc:p=>{const[c,i]=p.split('/');return docRef(c,i)},collection:col=>({path:col,doc:id=>docRef(col,id),add:async d=>{const r=docRef(col);await r.set(d);return r},
  onSnapshot(next,onErr){(subs[col]=subs[col]||[]).push(next);startRealtime();load(col).catch(e=>onErr&&onErr(err(e)));return()=>{subs[col]=subs[col].filter(f=>f!==next)}},
  async get(){await load(col);const m=cache[col];const docs=[...m.entries()].map(([id,d])=>({id,exists:true,data:()=>d}));return{docs,size:docs.length,empty:!docs.length}}})};

/* ---------- photos and files ---------- */
const EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic','image/svg+xml':'svg','video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm','audio/mp4':'m4a','audio/x-m4a':'m4a','audio/mpeg':'mp3','audio/webm':'webm','audio/wav':'wav','application/pdf':'pdf'};
const ASSETS={async upload(blob){const type=(blob.type||'application/octet-stream').split(';')[0];const d=new Date();const path=`${TEAM}/${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}/${crypto.randomUUID()}.${EXT[type]||'bin'}`;
    const{error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:type,cacheControl:'31536000',upsert:false});if(error)throw{code:/size|large/i.test(error.message)?'too_large':'upstream_error',message:error.message};
    const{data,error:e2}=await sb.storage.from(BUCKET).createSignedUrl(path,60*60*24*365*20);if(e2)throw{code:'upstream_error',message:e2.message};return{id:path,url:data.signedUrl,sizeBytes:blob.size,contentType:type}},
  async list(){throw{code:'capability_disabled',message:'n/a'}},
  async delete(id){const{error}=await sb.storage.from(BUCKET).remove([id]);return{deleted:!error}}};

/* ---------- downloads: share sheet on phones, normal download elsewhere ---------- */
const DLS={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data]);const file=new File([blob],filename,{type:blob.type||'application/octet-stream'});
  if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return{status:'saved'}}catch(e){if(e&&e.name==='AbortError')throw{code:'declined',message:'Cancelled'}}}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return{status:'saved'}}};

const USERCAP={async me(){return{id:USR.id,name:MYNAME,email:USR.email,avatarUrl:'',color:'',isOwner:ROLE==='Owner',canEdit:true}},async id(){return USR.id},async name(){return MYNAME},async isOwner(){return ROLE==='Owner'},async canEdit(){return true},async profiles(){return{}},async search(){return[]}};

window.claude={use:async n=>{await readyP;return n==='db'?DB:n==='assets'?ASSETS:n==='downloads'?DLS:n==='user'?USERCAP:null}};

/* ---------- account, invites, sign out (shown on More screens) ---------- */
window.BC={
  teamCard(){return `<div class="card stack" id="bc-team"><h2>Who Can Sign In</h2><p class="note">${esc(TEAMNAME)} · you're signed in as ${esc(USR?.email||'')} (${esc(ROLE)}).</p>
   ${['Owner','Office'].includes(ROLE)?`<div class="row"><label class="f" style="flex:1;min-width:150px">New Person's Role<select id="bc-role"><option>Crew</option><option>Super</option><option>Office</option><option>Trade Partner</option></select></label><button class="btn pri" data-bc="invite" style="align-self:end">Make Invite Code</button></div><div id="bc-inv"></div>`:'<p class="note">Ask the owner or office for an invite code to add someone.</p>'}
   <div id="bc-mem" class="list"></div></div>`},
  accountCard(){return `<div class="card stack"><h2>Account</h2><p class="note">Signed in as ${esc(USR?.email||'')} · ${esc(TEAMNAME)}</p><div class="row"><button class="btn" data-bc="install">Add to Home Screen</button><button class="btn bad" data-bc="signout">Sign Out</button></div></div>`},
  async signOut(){try{await sb.auth.signOut()}catch(e){}try{localStorage.removeItem('bc-team');localStorage.removeItem('pc-local')}catch(e){}location.reload()},
  async members(){const el=document.getElementById('bc-mem');if(!el)return;const{data}=await sb.from('sc_members').select('user_id,role,name').eq('team_id',TEAM);el.innerHTML=(data||[]).map(m=>`<div class="li"><span class="t"><b>${esc(m.name||'Teammate')}${m.user_id===USR.id?' (you)':''}</b><span>${esc(m.role)}</span></span></div>`).join('')},
  async invite(){const role=document.getElementById('bc-role').value;const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';crypto.getRandomValues(new Uint8Array(6)).forEach(x=>c+=A[x%32]);
    const{error}=await sb.from('sc_invites').insert({code:c,team_id:TEAM,role});const box=document.getElementById('bc-inv');if(error){box.innerHTML='<p class="callout">Couldn\'t make a code. Try again.</p>';return}
    const msg=`You're invited to ${TEAMNAME} on Build Camera. Open https://buildcamera.com on your phone, create an account, then enter invite code ${c}. The code works for 14 days.`;
    box.innerHTML=`<div class="callout info stack" style="gap:8px"><b style="font-size:22px;letter-spacing:.12em" class="mono">${c}</b><span>${esc(role)} · works once, for 14 days</span><textarea id="bc-invmsg" readonly>${esc(msg)}</textarea><div class="row"><button class="btn sm" data-bc="shareinv">Text It</button><button class="btn sm" data-a="copy" data-src="#bc-invmsg">Copy</button></div></div>`},
  installHelp(){const ios=/iPhone|iPad/i.test(navigator.userAgent);alertBox(ios?'In Safari, tap the Share button (square with an arrow), scroll down, tap <b>Add to Home Screen</b>, then <b>Add</b>.':'Open your browser menu (⋮) and tap <b>Install app</b> or <b>Add to Home screen</b>.')}
};
function alertBox(h){const t=document.getElementById('toast');if(t){t.innerHTML=h;t.hidden=false;clearTimeout(alertBox.t);alertBox.t=setTimeout(()=>t.hidden=true,7000)}}
let deferredInstall=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-bc]');if(!b)return;e.preventDefault();const k=b.dataset.bc;
  if(k==='signout')BC.signOut();else if(k==='invite')BC.invite();else if(k==='install'){if(deferredInstall){deferredInstall.prompt();deferredInstall=null}else BC.installHelp()}
  else if(k==='shareinv'){const t=document.getElementById('bc-invmsg').value;try{await navigator.share({text:t})}catch(err){try{await navigator.clipboard.writeText(t);alertBox('Copied. Paste it into a text.')}catch(e2){}}}});
new MutationObserver(()=>{const m=document.getElementById('bc-mem');if(m&&!m.dataset.l){m.dataset.l=1;BC.members()}}).observe(document.documentElement,{childList:true,subtree:true});

/* ---------- start ---------- */
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){const g=gate(`<h2>Set a New Password</h2><p id="bcmsg" class="msg" hidden></p><form id="bcr" class="fm"><label>New Password<input id="bc-np" type="password" minlength="8" autocomplete="new-password" required></label><button class="pri" type="submit">Save Password</button></form>`);g.querySelector('#bcr').onsubmit=async e2=>{e2.preventDefault();const{error}=await sb.auth.updateUser({password:g.querySelector('#bc-np').value});if(error){say(niceErr(error),true);return}afterAuth()}}});
document.addEventListener('DOMContentLoaded',async()=>{const{data:{session}}=await sb.auth.getSession();if(session)afterAuth();else showSignIn()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();

</script>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first field app. Sticky top bar, scrolling screen, fixed bottom nav with a raised camera button; full-screen sheets for capture, photo viewer, markup and reports. */
:root{
  --bg:#eef0ed; --panel:#ffffff; --sunk:#f6f7f5; --ink:#1b2024; --muted:#59626a; --line:#d7dbd5;
  --accent:#1d5c8f; --accent-ink:#ffffff; --accent-soft:#e1ebf4;
  --stamp:#f2b705; --stamp-ink:#1b2024;
  --good:#1f7a4a; --good-soft:#e2f2e9; --warn:#a15c00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#f9e3e1;
  --scrim:rgba(12,16,20,.55);
  --f-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121619; --panel:#1b2125; --sunk:#161b1e; --ink:#e6eaed; --muted:#9ba6ae; --line:#2d363c;
  --accent:#6eaee6; --accent-ink:#0b1824; --accent-soft:#1b2c3b;
  --good:#5cc38e; --good-soft:#163026; --warn:#e8a64a; --warn-soft:#33261a; --bad:#f08b83; --bad-soft:#3a1d1b;
  --scrim:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{

/* ---------- photo processing ---------- */
async function readExif(file){
  try{
    if(!/jpe?g/i.test(file.type)&&!/\.jpe?g$/i.test(file.name||''))return null;
    const v=new DataView(await file.slice(0,262144).arrayBuffer());
    if(v.getUint16(0)!==0xFFD8)return null; let o=2;
    while(o<v.byteLength-10){const m=v.getUint16(o);if((m&0xFF00)!==0xFF00)return null;const len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return parseTiff(v,o+10);o+=2+len}
  }catch(e){}return null;
}
function parseTiff(v,t){
  try{
    const le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);
    const ifd=p=>{const n=u16(p),e={};for(let i=0;i<n;i++){const q=p+2+i*12;e[u16(q)]={count:u32(q+4),off:q+8}}return e};
    const rat=p=>u32(p)/(u32(p+4)||1), out={}, e0=ifd(t+u32(t+4));
    if(e0[0x8825]){const g=ifd(t+u32(e0[0x8825].off));const ch=en=>en?String.fromCharCode(v.getUint8(en.off)):'';
      const tri=en=>{if(!en)return null;const p=t+u32(en.off);return rat(p)+rat(p+8)/60+rat(p+16)/3600};
      const la=tri(g[2]),ln=tri(g[4]);if(la!=null&&ln!=null&&(la||ln)){out.lat=ch(g[1])==='S'?-la:la;out.lng=ch(g[3])==='W'?-ln:ln}}
    if(e0[0x8769]){const ex=ifd(t+u32(e0[0x8769].off)),d=ex[0x9003];if(d&&d.count>=19){const p=t+u32(d.off);let s='';for(let i=0;i<19;i++)s+=String.fromCharCode(v.getUint8(p+i));
      const m=s.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);if(m)out.taken=new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime()}}
    return out;
  }catch(e){return null}
}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}

async function makeCode(seed){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let b;
  try{b=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(seed+Math.random())))]}catch(e){b=[...Array(8)].map(()=>Math.floor(Math.random()*256))}
  let c='';for(let i=0;i<8;i++)c+=A[b[i]%32];return 'PC-'+c.slice(0,4)+'-'+c.slice(4);
}
function nearestProject(la,ln){let best=null;S.projects.forEach(p=>{if(p.lat==null||p.status==='Done')return;const d=km(la,ln,p.lat,p.lng);if(!best||d<best.d)best={p,d}});return best}
async function stampImage(file,info,isDoc){
  const url=URL.createObjectURL(file); const img=await loadImg(url); URL.revokeObjectURL(url);
  const max=2048,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const W=Math.round(img.naturalWidth*sc),H=Math.round(img.naturalHeight*sc);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0,W,H);
  if(isDoc){const d=x.getImageData(0,0,W,H),a=d.data;for(let i=0;i<a.length;i+=4){let g=.3*a[i]+.59*a[i+1]+.11*a[i+2];g=Math.max(0,Math.min(255,(g-128)*1.6+150));a[i]=a[i+1]=a[i+2]=g}x.putImageData(d,0,0)}
  const qual=isDoc?null:quality(c,W,H);
  /* stamp: bottom-right, white text with soft shadow — Job / date and time / GPS / proof code */
  const fs=Math.max(18,Math.round(Math.max(W,H)*.021)), gap=fs*1.18, pad=Math.round(fs*1.1);
  const d=new Date(info.takenAt);
  const when=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' at '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit'});
  const gps=info.lat!=null?`${Math.abs(info.lat).toFixed(6)}° ${info.lat>=0?'N':'S'} ${Math.abs(info.lng).toFixed(6)}° ${info.lng>=0?'E':'W'}`:'GPS not available';
  const job=info.project||'Jobsite';
  const face='-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif';
  const rows=[[info.company||coName(),`700 ${Math.round(fs*.78)}px ${face}`],[job,`700 ${fs}px ${face}`],[when,`600 ${fs}px ${face}`],[gps,`600 ${fs}px ${face}`]];
  x.textAlign='right';x.textBaseline='alphabetic';
  const maxW=W*.72; const fit=(t)=>{let s2=t;while(s2.length>4&&x.measureText(s2).width>maxW)s2=s2.slice(0,-2);return s2===t?t:s2+'…'};
  let yb=H-pad; const out=[];
  for(let k=rows.length-1;k>=0;k--){out.unshift([rows[k][0],rows[k][1],yb]);yb-=gap}
  out.forEach(([t,f,yy])=>{x.font=f;const tx=fit(t);x.fillStyle='rgba(0,0,0,.75)';

function ptMap(p){
  const ps=allPhotos().filter(x=>x.projectId===p.id&&x.lat!=null&&x.gpsSource==='photo');
  const pts=ps.map(x=>[x.lat,x.lng]); if(p.lat!=null)pts.push([p.lat,p.lng]);
  const gm=p.lat!=null?`<a class="btn sm" href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" rel="noopener">${I('pin')} Open Job in Google Maps</a>`:'';
  if(pts.length<1)return `<div class="empty">${I('map')}<b>Nothing to map yet</b><span>Set the job's GPS spot in Job Info. Photos with their own GPS show here as pins.</span><button class="btn" data-a="ptab" data-t="info">Go to Job Info</button></div>`;
  const la=pts.map(q=>q[0]),ln=pts.map(q=>q[1]);let a=Math.min(...la),b=Math.max(...la),c=Math.min(...ln),d=Math.max(...ln);
  const padv=Math.max((b-a)*.15,0.0004),padh=Math.max((d-c)*.15,0.0004);a-=padv;b+=padv;c-=padh;d+=padh;
  const W=600,H=420,X=x=>((x-c)/(d-c))*W,Y=y=>H-((y-a)/(b-a))*H;

  for(let i=1;i<6;i++)svg+=`<line x1="${i*W/6}" y1="0" x2="${i*W/6}" y2="${H}" stroke="var(--line)"/><line x1="0" y1="${i*H/6}" x2="${W}" y2="${i*H/6}" stroke="var(--line)"/>`;

  svg+=`<text x="10" y="${H-10}" font-size="12" fill="var(--muted)" font-family="IBM Plex Mono,monospace">Width ≈ ${meters} m · North up</text></svg>`;
  return `<div class="mapbox">${svg}</div><div class="row" style="margin-top:10px">${gm}<span class="note">${ps.length} photo${ps.length===1?'':'s'} with their own GPS. Tap a pin to open it.</span></div>`;
}

const gmSearch=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a||'');
function knownAddresses(){
  const m=new Map();
  S.projects.forEach(p=>{if(p.address){const k=p.address.trim().toLowerCase();if(!m.has(k))m.set(k,{address:p.address.trim(),lat:p.lat,lng:p.lng,from:p.name,customer:p.customer})}});
  return [...m.values()];
}
function parseGps(t){
  t=String(t||'').trim(); if(!t)return null; let m,la,ln;
  if((m=t.match(/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/))||(m=t.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/))||(m=t.match(/[?&](?:q|ll|query|center|destination|sll)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i))){la=+m[1];ln=+m[2]}
  else if((m=t.match(/(-?\d{1,2}\.\d{3,})\s*°?\s*([NS])?\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})\s*°?\s*([EW])?/i))){la=+m[1];ln=+m[3];if(m[2]&&/s/i.test(m[2]))la=-Math.abs(la);if(m[4]&&/w/i.test(m[4]))ln=-Math.abs(ln)}
  else if((m=t.match(/(\d{1,2})°\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([NS])[\s,]+(\d{1,3})°\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([EW])/i))){la=+m[1]+m[2]/60+m[3]/3600;ln=+m[5]+m[6]/60+m[7]/3600;if(/s/i.test(m[4]))la=-la;if(/w/i.test(m[8]))ln=-ln}
  else return null;
  if(!(Math.abs(la)<=90&&Math.abs(ln)<=180)||(la===0&&ln===0))return null;
  return {lat:+la.toFixed(6),lng:+ln.toFixed(6)};
}
function addrFromLink(t){const m=String(t).match(/\/maps\/place\/([^/@?]+)/);if(!m)return '';try{return decodeURIComponent(m[1].replace(/\+/g,' ')).trim()}catch(e){return ''}}
function gpsMsg(pre,txt,cls){const el=$('#'+pre+'-gpsmsg');if(el){el.textContent=txt;el.className='mono '+(cls||'')}}
function showSuggest(pre){
  const inp=$('#'+pre+'-address'),box=$('#'+pre+'-acl');if(!inp||!box)return;
  const q=inp.value.trim().toLowerCase(); const words=q.split(/\s+/).filter(Boolean);
  const kn=q.length<2?[]:knownAddresses().filter(a=>a.address.toLowerCase()!==q&&words.every(w=>(a.address+' '+(a.from||'')).toLowerCase().includes(w))).slice(0,3);
  const tt=(AC[pre]||[]).filter(a=>!kn.some(k=>k.address.toLowerCase()===a.address.toLowerCase())&&a.address.toLowerCase()!==q);
  const list=[...kn,...tt].slice(0,7);
  if(!list.length){box.hidden=true;box.innerHTML='';inp.setAttribute('aria-expanded','false');return}
  box.innerHTML=list.map((a,i)=>`<button type="button" role="option" data-a="acPick" data-pre="${pre}" data-i="${i}"><b>${esc(a.address)}</b><span>${a.src==='tt'?(a.kind==='Street'?'Street only · set exact spot after':'Address search · fills GPS'):'Used on '+esc(a.from)+(a.lat!=null?' · GPS on file':'')}</span></button>`).join('');
  box._list=list; box.hidden=false;if(tt.length)box.insertAdjacentHTML('beforeend','<span class="note" style="display:block;padding:6px 12px;font-size:11px">Address results by TomTom</span>'); inp.setAttribute('aria-expanded','true');
}

/* daily log */
function dayData(p,date){
  const ps=allPhotos().filter(x=>x.projectId===p.id&&dayKey(x.takenAt)===date);
  const done=S.tasks.filter(t=>t.projectId===p.id&&t.done&&t.doneAt&&dayKey(t.doneAt)===date);
  const tm=S.time.filter(t=>t.projectId===p.id&&dayKey(t.in)===date);
  const crews={};tm.forEach(t=>{const h=((t.out||Date.now())-t.in)/36e5;const k=t.who||'Crew';crews[k]=(crews[k]||0)+h});
  const cks=[];S.checklists.filter(c=>c.projectId===p.id).forEach(c=>c.items.forEach(i=>{if(i.done&&i.doneAt&&dayKey(i.doneAt)===date)cks.push(c.title+': '+i.t)}));
  return {ps,done,crews,cks,zones:[...new Set(ps.map(x=>x.zone).filter(Boolean))],trades:[...new Set(ps.map(x=>x.trade).filter(Boolean))]};
}

  catch(e){const er=$('#camerr');if(er){er.hidden=false;er.innerHTML='Camera access was blocked. Allow camera for buildcamera.com in Settings → Safari → Camera, or <button class="btn sm" data-a="camFallback">Use the phone camera</button>'}}
  if(navigator.geolocation&&CAM.watch==null){CAM.watch=navigator.geolocation.watchPosition(p=>{CAM.gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};const g=$('#camgps');if(g){g.textContent='GPS ±'+Math.round(p.coords.accuracy*3.28)+' ft';g.className='camgps ok'}},()=>{const g=$('#camgps');if(g){g.textContent='No GPS';g.className='camgps bad'}},{enableHighAccuracy:true,maximumAge:10000,timeout:20000})}}
function camStop(){if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null}if(CAM.watch!=null&&navigator.geolocation){navigator.geolocation.clearWatch(CAM.watch);CAM.watch=null}}
const sndOn=()=>{try{return localStorage.getItem('pc-snd')!=='off'}catch(e){return true}};
let ACX=null;
function shutterSound(){if(!sndOn())return;try{ACX=ACX||new (window.AudioContext||window.webkitAudioContext)();if(ACX.state==='suspended')ACX.resume();const t=ACX.currentTime+.005,sr=ACX.sampleRate;
  const burst=(at,dur,gain,hz)=>{const len=Math.max(1,Math.floor(sr*dur)),buf=ACX.createBuffer(1,len,sr),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);
    const src=ACX.createBufferSource();src.buffer=buf;const f=ACX.createBiquadFilter();f.type='bandpass';f.frequency.value=hz;f.Q.value=.8;const g=ACX.createGain();g.gain.value=gain;src.connect(f);f.connect(g);g.connect(ACX.destination);src.start(t+at)};
  burst(0,.035,1.4,3200);burst(.065,.055,1,2200)}catch(e){}}
async function camShoot(){const v=$('#camv');if(!v||!v.videoWidth||CAM.busy)return;CAM.busy=true;
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
  shutterSound();const f=$('#camflash');if(f){f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));CAM.busy=false;
  const cap=M.cap,ctx={...cap.ctx,projectId:cap.pid,lockProject:false,fromCamera:true,gps:CAM.gps};
  ctx.onAdd=id=>{cap.shot=[id,...(cap.shot||[])];cap.count=(cap.count||0)+1;const n=$('#camcount');if(n){n.textContent=cap.count;n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump')}const l=document.querySelector('.camlast');const p=PH(id);if(l&&p){l.innerHTML=`<img src="${esc(p.url)}" alt="">`;l.classList.remove('got');void l.offsetWidth;l.classList.add('got')}const ct=$('#camtoast');if(ct){ct.querySelector('span').textContent=cap.count>1?cap.count+' saved':'Saved';ct.classList.remove('go');void ct.offsetWidth;ct.classList.add('go')}};
  processFile(blob,ctx).then(id=>{if(id)setLastZT(cap.pid,cap.ctx.zone,cap.ctx.trade,(cap.ctx.tags||[])[0])}).catch(()=>toast('Couldn\'t save that photo. Try again.'));
}

async function mkInit(){
  Object.assign(MK,{tool:'arrow',color:'#ff3b30',shapes:[],cur:null,scale:null,text:''});
  const p=PH(M.id), c=$('#mkc'); MK.c=c; MK.x=c.getContext('2d');
  try{MK.img=await imgFromUrl(p.url)}catch(e){toast('Couldn\'t open that photo for markup.');closeModal();return}
  const sc=Math.min(1,1800/Math.max(MK.img.naturalWidth,MK.img.naturalHeight)); c.width=Math.round(MK.img.naturalWidth*sc); c.height=Math.round(MK.img.naturalHeight*sc);
  MK.lw=Math.max(4,c.width*.006); mkDraw();
  const pt=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);const q=pt(e);
    if(MK.tool==='text'){if(!MK.text.trim()){toast('Type your label in the box below first.');return}MK.shapes.push({t:'text',p:q,s:MK.text,c:MK.color});mkDraw();return}
    MK.cur=MK.tool==='pen'?{t:'pen',c:MK.color,pts:[q]}:{t:MK.tool,c:MK.color,a:q,b:q};});
  c.addEventListener('pointermove',e=>{if(!MK.cur)return;const q=pt(e);if(MK.cur.t==='pen')MK.cur.pts.push(q);else MK.cur.b=q;mkDraw()});
  c.addEventListener('pointerup',()=>{if(!MK.cur)return;const s=MK.cur;MK.cur=null;
    if(s.t!=='pen'&&Math.hypot(s.b[0]-s.a[0],s.b[1]-s.a[1])<6){mkDraw();return}
    if(s.t==='scale'){MK.shapes=MK.shapes.filter(x=>x.t!=='scale');MK.shapes.push(s);mkOpt('scale')}else MK.shapes.push(s);mkDraw()});
  mkOpt();
}
function mkOpt(kind){
  const o=$('#mkopt');if(!o)return;
  if(kind==='scale'||MK.tool==='scale')o.innerHTML=`<span class="note">Draw along something you know the length of, then enter it:</span><input type="number" id="mk-ft" min="0" placeholder="Feet" style="width:90px"><input type="number" id="mk-in" min="0" step="0.25" placeholder="Inches" style="width:100px"><button class="btn sm pri" data-a="mkScale">Set Scale</button>${MK.scale?`<span class="pill good">Scale set</span>`:''}`;
  else if(MK.tool==='text')o.innerHTML=`<input type="text" id="mk-text" value="${esc(MK.text)}" placeholder="Label, e.g. Missing Strap" data-in="mkText" style="flex:1"><span class="note">then tap the photo to place it</span>`;
  else if(MK.tool==='measure')o.innerHTML=MK.scale?'<span class="note">Drag across anything to measure it.</span>':'<span class="callout">Set the scale first: pick Set Scale and draw along something you know, like a 4 ft level.</span>';
  else o.innerHTML='<span class="note">Draw on the photo. Your original stays untouched.</span>';
}
const ftIn=inch=>{const f=Math.floor(inch/12),i=Math.round((inch-f*12)*4)/4;return (f?f+"' ":'')+i+'"'};

/* geometry and job matching */
function toM(lat,lng,lat0,lng0){return [(lng-lng0)*Math.cos(lat0*Math.PI/180)*111320,(lat-lat0)*110540]}
function fromM(x,y,lat0,lng0){return [lat0+y/110540,lng0+x/(Math.cos(lat0*Math.PI/180)*111320)]}
function inPoly(lat,lng,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1];if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))ins=!ins}return ins}
function matchProject(la,ln){
  const act=S.projects.filter(p=>p.status!=='Done');
  const inside=act.find(p=>p.boundary&&p.boundary.length>=3&&inPoly(la,ln,p.boundary));if(inside)return inside;
  let best=null;act.forEach(p=>{if(p.lat==null||(p.boundary&&p.boundary.length>=3))return;const d=km(la,ln,p.lat,p.lng)*1000;if(d<=(p.radius||1200)&&(!best||d<best.d))best={p,d}});return best&&best.p;
}

  const Z=340,sp=w.span,[la0,ln0]=w.c0;const X=(la,ln)=>{const[mx,my]=toM(la,ln,la0,ln0);return [Z/2+mx/sp*Z,Z/2-my/sp*Z]};

async function sxShare(){

  if(el.dataset.in==='q'){V.q=el.value;const pos=el.selectionStart;dirty=false;$('#main').innerHTML=screen();const q=$('#q');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}

  else if(k==='ct'){const p=P(el.dataset.pid),i=+el.dataset.i;upd('projects',p.id,{contacts:(p.contacts||[]).map((c,j)=>j===i?{...c,[el.dataset.k]:el.value.trim()}:c)})}
  else if(k==='sxTo'){}

  const num=x=>x===''||x==null?null:(isFinite(+x)?+x:null);
  if(k==='createProject'){if(MW.np)MW.np.open=false;const id=await put('projects',{companyName:(v.companyName||'').trim(),name:titleCase(v.name.trim()),jobNumber:(v.jobNumber||'').trim(),address:v.address.trim(),group:v.group.trim(),lat:num(v.lat),lng:num(v.lng),status:'Active',createdAt:Date.now()});closeModal();V.pid=id;V.tab='project';V.ptab='photos';V.lastProject=id;saveView();render();toast('Project created')}
  else if(k==='saveProject'){upd('projects',f.dataset.id,{name:v.name.trim(),address:v.address.trim(),group:v.group.trim(),status:v.status==='Done'?'Done':'Active',lat:num(v.lat),lng:num(v.lng),tpProject:v.tpProject.trim(),companyName:(v.companyName||'').trim(),jobNumber:(v.jobNumber||'').trim(),radius:+v.radius||1200,customer:v.customer.trim(),phone:v.phone.trim()});toast('Job info saved')}
  else if(k==='comment'){const t=v.text.trim();if(!t)return;await put('comments',{photoId:f.dataset.id,projectId:PH(f.dataset.id)?.projectId,text:t,by:ME.id,byName:ME.name,at:Date.now()});S.members.filter(m=>m.name&&t.includes('@'+m.name)).forEach(m=>alertFor(m.id,`${ME.name} mentioned you: "${t.slice(0,120)}"`,{photoId:f.dataset.id,projectId:PH(f.dataset.id)?.projectId}));f.reset();$('#cmts').innerHTML=commentsHtml(f.dataset.id)}
  else if(k==='bulkSave'){const ps=M.ids.map(PH).filter(p=>p&&!p.pending);let n=0;
    for(const p of ps){const ch={};
      if(v.zoneClear)ch.zone='';else if(v.zone.trim())ch.zone=titleCase(v.zone.trim());
      if(v.tradeClear)ch.trade='';else if(v.trade.trim())ch.trade=titleCase(v.trade.trim());
      let tags=[...(p.tags||[])];if(v.tagAdd&&!tags.includes(v.tagAdd))tags.push(v.tagAdd);if(v.tagRem)tags=tags.filter(t=>t!==v.tagRem);
      if(v.port==='on'){ch.portfolio=true;if(!tags.includes('Portfolio'))tags.push('Portfolio')}else if(v.port==='off'){ch.portfolio=false;tags=tags.filter(t=>t!=='Portfolio')}
      if(tags.join('|')!==(p.tags||[]).join('|'))ch.tags=tags;
      if(v.proj&&v.proj!==p.projectId)ch.projectId=v.proj;
      const t=v.note.trim();if(t)ch.note=v.noteAppend&&p.note?p.note.trim()+' '+t:t;
      if(Object.keys(ch).length){await upd('photos',p.id,ch);n++}}
    closeModal();V.selMode=false;V.sel=new Set();render();toast(n?`Saved changes to ${n} photo${n===1?'':'s'}`:'Nothing to change');}
  else if(k==='pcomment'){const t=v.text.trim();if(!t)return;const pid=f.dataset.id;await put('comments',{photoId:null,projectId:pid,text:t,by:ME.id,byName:ME.name,at:Date.now()});S.members.filter(m=>m.name&&t.includes('@'+m.name)).forEach(m=>alertFor(m.id,`${ME.name} mentioned you on ${P(pid)?.name||'a job'}: "${t.slice(0,120)}"`,{projectId:pid}));f.reset();const c=$('#pconv');if(c)c.innerHTML=pconvHtml(pid)}
  else if(k==='saveTask'){const t=M.task;const tid=await put('tasks',{projectId:v.pid,title:v.title.trim(),type:v.type,assignee:v.assignee||null,assigneeText:v.assigneeText.trim(),due:v.due||'',photoId:t.photoId||null,done:false,createdAt:Date.now(),by:ME.name});if(v.assignee)alertFor(v.assignee,`${ME.name} assigned you a ${v.type==='punch'?'punch item':'task'}: ${v.title.trim()} (${P(v.pid)?.name||''})`,{taskId:tid,photoId:t.photoId||null,projectId:v.pid});closeModal();toast(v.type==='punch'?'Punch item added':'Task added')}
  else if(k==='saveMember'){const m=M.m||{};await put('members',{...(m.id?{id:m.id}:{}),name:v.name.trim(),role:v.role,phone:v.phone.trim(),company:v.company.trim(),trade:v.trade.trim()});closeModal()}
  else if(k==='ckAdd'){const c=S.checklists.find(x=>x.id===f.dataset.id);if(!v.t.trim())return;upd('checklists',c.id,{items:[...c.items,{t:v.t.trim(),needPhoto:false,done:false}]});renderModal();setTimeout(()=>$('#ce-new')?.focus(),30)}
  else if(k==='saveLog'){await put('logs',{id:f.dataset.id,projectId:f.dataset.pid,date:f.dataset.date,weather:v.weather,delays:v.delays,notes:v.notes,summary:v.summary,by:ME.name,savedAt:Date.now()});toast('Daily log saved')}
  else if(k==='makeReport'){if(v.from>v.to){toast('The From date is after the To date.');return}savePdf(P(f.dataset.pid),v)}
  else if(k==='verify'){V.vcode=v.code;render()}
  else if(k==='clockIn'){if(!v.pid)return;const who=v.who.trim()||ME.name;await put('time',{projectId:v.pid,who,in:Date.now(),out:null});V.lastProject=v.pid;saveView();afterShot=null;openModal({kind:'capture',pid:v.pid,lockProject:true,title:'Start of Day Photos',why:`${who} is clocked in. Take a few photos of the site as you found it. Close this when you're done.`,ctx:{tags:['Start of Day'],zone:'',trade:'',note:''}})}
});
/* file inputs */
async function handleFiles(files,kind){
  if(!files.length)return;
  if(kind==='logo'){const f=files[0];if(!AS){toast('Uploads aren\'t available here.');return}toast('Uploading logo…');try{const up=await AS.upload(f);await put('settings',{...SET(),id:'company',logoUrl:up.url,logoAsset:up.id});LOGO.url=null;toast('Logo saved. New photos and PDFs will use it.')}catch(e){toast('Couldn\'t upload the logo. Try a PNG or JPG under 5 MB.')}return}
  if(kind==='avatar'){try{toast('Saving your photo…');const blob=await avCrop(files[0]);let url;if(AS){const up=await AS.upload(blob);url=up.url}else url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
    const cur=S.settings.find(x=>x.id==='avatars')||{id:'avatars',map:{}};const map={...(cur.map||{})};if(ME.id)map['id:'+ME.id]=url;map['n:'+ME.name]=url;await put('settings',{id:'avatars',map});toast('Your photo is set. It shows on the photos you take.')}catch(e){toast('Couldn\'t use that photo. Try another one.')}return}
  if(kind==='csv'){const t=await files[0].text();M={kind:'import',text:t,rows:mapRows(parseRows(t))};renderModal();return}
  if(kind==='audio'&&M&&M.voiceFor){const pid=M.voiceFor;const f=files[0];toast('Uploading voice note…');
    try{if(!AS)throw 0;const up=await AS.upload(f);upd('photos',pid,{voiceUrl:up.url,voiceAsset:up.id});renderModal();toast('Voice note added')}catch(e){toast('Couldn\'t upload the voice note. Try again with signal.')}return}
  const ctx={...(M&&M.ctx||{tags:[],zone:'',trade:'',note:''}),projectId:M&&M.pid||V.lastProject,lockProject:!!(M&&M.lockProject),beforeOf:M&&M.beforeOf,kind:kind==='doc'?'doc':undefined,fromCamera:kind==='photo'};
  if(!ctx.projectId&&!S.projects.length){toast('Add a Project first.');return}
  if(ctx.projectId&&kind!=='doc')setLastZT(ctx.projectId,ctx.zone,ctx.trade,(ctx.tags||[])[0]);
  const cb=afterShot; afterShot=null;
  const keepOpen=M&&M.kind==='capture'&&!M.single&&!M.hidden;
  if(keepOpen){const cm=M;ctx.onAdd=id=>{cm.shot=[id,...(cm.shot||[])];if(M===cm)capStrip()}}
  if(!keepOpen)closeModal();
  toast(files.length>1?`Stamping ${files.length} photos…`:'Stamping photo…');
  let last=null; for(const f of files){try{last=await processFile(f,ctx)}catch(e){toast('Couldn\'t read that file. Try another photo.')}}
  if(last&&cb)cb(last);
  if(last&&!cb&&ctx.beforeOf)toast('After photo paired. Open either one to compare.',3200);
  else if(last&&!cb)toast(files.length>1?files.length+' saved':'Saved with stamp and proof code');
  if(keepOpen&&M&&M.kind==='capture'){M.ctx.note='';const n=$('#cap-note');if(n)n.value='';M.count=(M.count||0)+files.length;const c=$('#cap-count');if(c){c.hidden=false;c.className='callout info';c.innerHTML=`<b>${M.count} saved</b> this round. Keep going, or close when you're done. You can delete any photo later.`}const b=$('#cap-shoot');if(b)b.innerHTML=I('camera')+' Take Next Photo'}
}
[['#in-avatar','avatar'],['#in-photo','photo'],['#in-lib','lib'],['#in-video','video'],['#in-doc','doc'],['#in-audio','audio'],['#in-logo','logo'],['#in-csv','csv']].forEach(([s,k])=>$(s).addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';handleFiles(fs,k)}));

async function avCrop(file){const url=URL.createObjectURL(file);try{const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),m=Math.min(img.naturalWidth,img.naturalHeight);
  x.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,256,256);return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}finally{URL.revokeObjectURL(url)}}
async function usage(){if(!AS)return;try{const r=await AS.list();const el=$('#usage');if(el)el.textContent=`Storage: ${r.usage.files} files, ${(r.usage.bytes/1048576).toFixed(1)} MB of ${(r.usage.maxBytes/1048576/1024).toFixed(1)} GB`}catch(e){}}

/* ---------- start ---------- */
try{matchMedia('(min-width:1000px)').addEventListener('change',()=>{render();if(M&&M.kind!=='cam')renderModal()})}catch(e){}
render();
(async()=>{
  const use=n=>window.claude?.use?.(n).catch(()=>null)||Promise.resolve(null);
  const [db,as,us,sm,dl,mc]=await Promise.all([use('db'),use('assets'),use('user'),use('sample'),use('downloads'),use('mcp')]);
  DB=db;AS=as;USER=us;SAMPLE=sm;DL=dl;MCP=mc;READY=true;
  if(USER){try{const me=await USER.me();ME={id:me.id,name:me.name||'Me'}}catch(e){}}
  if(!DB){loadLocal()}else{
    COLS.forEach(c=>DB.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({...d.data(),id:d.id}));scheduleRender()},()=>{}));
  }
  qLoad(); render();
})();
