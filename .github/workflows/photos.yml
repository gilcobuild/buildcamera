name: Fetch sample photos
on:
  push:
    branches: [store-assets]
    paths: [photos.txt, .github/workflows/photos.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download free Unsplash photos (Unsplash License, free for commercial use)
        run: |
          pip install --quiet pillow
          mkdir -p photos raw
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15"
          while read -r id name; do
            [ -z "$id" ] && continue
            code=$(curl -sSL -A "$UA" -o "raw/$name.jpg" -w "%{http_code} %{url_effective}" "https://unsplash.com/photos/$id/download?force=true" || true)
            echo "$name: $code $(stat -c %s raw/$name.jpg 2>/dev/null)" | tee -a fetch-log.txt; head -c 300 "raw/$name.jpg" | tr -cd "[:print:]" | head -c 200 >> fetch-log.txt; echo >> fetch-log.txt
          done < photos.txt
          python3 - <<'PY'
          import os
          from PIL import Image, ImageOps
          for f in sorted(os.listdir('raw')):
              try:
                  im = ImageOps.exif_transpose(Image.open('raw/'+f)).convert('RGB')
                  im.thumbnail((1800, 1800))
                  im.save('photos/'+f, quality=82, optimize=True)
                  print('ok', f, im.size, file=open('fetch-log.txt','a'))
              except Exception as e:
                  print('bad', f, e, file=open('fetch-log.txt','a'))
          PY
          ls -la photos
      - name: Save
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add photos fetch-log.txt; git commit -m "Sample photos from Unsplash" || exit 0; git push
