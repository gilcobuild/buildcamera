<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-Xc4brWDNbmNQWzC3fYkXst/vg9CJB+hM5clyG3KFqtg=' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://challenges.cloudflare.com https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' blob: data: https://zrdgebzujpsatzxcvryi.supabase.co wss://zrdgebzujpsatzxcvryi.supabase.co https://api.pwnedpasswords.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device Preview · Build Camera</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
<style>
:root{--bg:#d9dcd8;--ink:#1b2024;--muted:#59626a;--bar:#1b2024;--stamp:#f2b705;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;overflow:hidden}
.tb{position:fixed;inset:0 0 auto;height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--bar);color:#fff;z-index:5}
.tb b{font-size:15px;margin-right:10px;white-space:nowrap}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;font:600 14px/1 inherit;padding:9px 16px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--stamp);color:#1b2024}
.tb .sp{flex:1}
.tb .lnk{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font:600 13px inherit;padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none}
.tb .sz{font-size:12.5px;color:#b9c2c9;white-space:nowrap}
.stage{position:fixed;inset:56px 0 0;overflow:hidden}
.dev{position:absolute;left:50%;top:50%;transform-origin:center center}
/* phone */
.phone{width:418px;height:872px;border-radius:64px;background:#111;padding:14px;box-shadow:0 0 0 2px #3a3d40,0 30px 60px rgba(0,0,0,.35)}
.phone .scr{border-radius:50px}
.phone .isl{position:absolute;left:50%;top:25px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000;z-index:3}
.phone .sb{height:54px;padding:0 30px 0 44px;font-size:17px}
.phone .hb{height:30px}
/* tablet */
.tab{width:868px;height:1228px;border-radius:44px;background:#1a1c1e;padding:24px;box-shadow:0 0 0 2px #3a3d40,0 30px 60px rgba(0,0,0,.35)}
.tab .scr{border-radius:22px}
.tab .sb{height:28px;padding:0 24px;font-size:13px}
.tab .hb{height:20px}
/* laptop */
.lap{width:1560px}
.lap .lid{background:#1d1f21;border-radius:22px 22px 0 0;padding:26px 26px 34px;box-shadow:0 0 0 2px #3a3d40}
.lap .scr{border-radius:6px}
.lap .chrome{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#e8eaed;flex:none}
.lap .chrome i{width:12px;height:12px;border-radius:50%;display:block}
.lap .url{flex:1;margin-left:14px;height:26px;border-radius:13px;background:#fff;font-size:13px;color:#555;display:flex;align-items:center;padding:0 14px}
.lap .base{height:26px;margin:0 -60px;background:linear-gradient(#c9ccd0,#9fa3a8);border-radius:0 0 26px 26px;box-shadow:0 30px 50px rgba(0,0,0,.3)}
.lap .base:before{content:"";display:block;width:220px;height:10px;margin:0 auto;background:#8d9196;border-radius:0 0 10px 10px}
.scr{position:relative;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.sb{flex:none;display:flex;align-items:center;justify-content:space-between;font-weight:600;color:#000;background:#fff;letter-spacing:-.2px}
.sb .ic{display:flex;align-items:center;gap:6px}
.fw{flex:1;overflow:hidden;min-height:0}
.fw iframe{border:0;display:block;height:100%}
.hb{flex:none;background:#fff;position:relative}
.hb:after{content:"";position:absolute;left:50%;top:50%;width:134px;height:5px;margin:-2px 0 0 -67px;border-radius:3px;background:#111}
.tab .hb:after{width:300px;margin-left:-150px}
@media (max-width:700px){.tb b,.tb .sz{display:none}}
</style>
</head>
<body>
<div class="tb"><b>Device Preview</b><div class="seg" role="group" aria-label="Device"><button data-d="phone">iPhone</button><button data-d="tab">iPad</button><button data-d="lap">Laptop</button></div><span class="sz" id="sz"></span><span class="sp"></span><button class="lnk" id="rl">Reload</button><a class="lnk" href="../">Admin</a></div>
<div class="stage" id="stage"></div>
<script>
(function(){
var SIG='<svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10" y="3" width="3.2" height="9" rx="1"/><rect x="15" y="0" width="3.2" height="12" rx="1" opacity=".3"/></svg>';
var WIFI='<svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.2 2.5l1.2-1.2C14 1.6 11.4.5 8.5.5S3 1.6 1.1 3.6l1.2 1.2C3.9 3.2 6.1 2.3 8.5 2.3zm0 3.4c1.5 0 2.8.6 3.8 1.5l1.2-1.2C12.2 4.8 10.4 4 8.5 4S4.8 4.8 3.5 6l1.2 1.2c1-.9 2.3-1.5 3.8-1.5zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.2 7 9.7c.4-.4.9-.6 1.5-.6z"/></svg>';
var BAT='<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity=".35"/><rect x="2" y="2" width="15" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" opacity=".4"/></svg>';
var D={phone:{w:390,h:844,name:'iPhone 15 · 390 × 844'},tab:{w:820,h:1180,name:'iPad Air · 820 × 1180'},lap:{w:1440,h:900,name:'Laptop · 1440 × 900'}};
var sbw=(function(){var d=document.createElement('div');d.style.cssText='width:100px;height:100px;overflow:scroll;position:absolute;top:-999px';document.body.appendChild(d);var w=d.offsetWidth-d.clientWidth;d.remove();return w})();
var cur='phone',src='/';
try{cur=localStorage.getItem('bc-dev')||'phone'}catch(e){}
if(!D[cur])cur='phone';
function clock(){var d=new Date(),h=d.getHours()%12||12;return h+':'+String(d.getMinutes()).padStart(2,'0')}
function frame(w){return '<div class="fw"><iframe id="app" title="Build Camera" src="'+src+'" style="width:'+(w+sbw)+'px" allow="camera;microphone;geolocation;clipboard-write"></iframe></div>'}
function build(){
  var d=D[cur],st=document.getElementById('stage'),h;
  if(cur==='phone')h='<div class="dev phone" id="dev"><span class="isl"></span><div class="scr" style="width:390px;height:844px"><div class="sb"><span class="clk"></span><span class="ic">'+SIG+WIFI+BAT+'</span></div>'+frame(390)+'<div class="hb"></div></div></div>';
  else if(cur==='tab')h='<div class="dev tab" id="dev"><div class="scr" style="width:820px;height:1180px"><div class="sb"><span class="clk"></span><span class="ic">'+WIFI+BAT+'</span></div>'+frame(820)+'<div class="hb"></div></div></div>';
  else h='<div class="dev lap" id="dev"><div class="lid"><div class="scr" style="width:1508px;height:938px"><div class="chrome"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="url">buildcamera.com</span></div>'+frame(1508).replace('width:'+(1508+sbw),'width:'+(1508+sbw))+'</div></div><div class="base"></div></div>';
  st.innerHTML=h;
  [].forEach.call(document.querySelectorAll('.clk'),function(e){e.textContent=clock()});
  [].forEach.call(document.querySelectorAll('.seg button'),function(b){b.setAttribute('aria-pressed',b.dataset.d===cur)});
  document.getElementById('sz').textContent=d.name;
  fit();
}
function fit(){var dv=document.getElementById('dev');if(!dv)return;dv.style.transform='translate(-50%,-50%)';var st=document.getElementById('stage');var s=Math.min(1,(st.clientWidth-40)/dv.offsetWidth,(st.clientHeight-40)/dv.offsetHeight);dv.style.transform='translate(-50%,-50%) scale('+s+')'}
function keepPage(){try{var f=document.getElementById('app');if(f&&f.contentWindow&&f.contentWindow.location.origin===location.origin)src=f.contentWindow.location.pathname+f.contentWindow.location.search}catch(e){}}
document.querySelector('.seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;keepPage();cur=b.dataset.d;try{localStorage.setItem('bc-dev',cur)}catch(x){}build()});
document.getElementById('rl').addEventListener('click',function(){keepPage();build()});
addEventListener('resize',fit);
setInterval(function(){[].forEach.call(document.querySelectorAll('.clk'),function(e){e.textContent=clock()})},10000);
build();
})();
</script>
</body>
</html>
